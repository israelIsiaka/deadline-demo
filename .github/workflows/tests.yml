name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Start the app (staging profile)
        working-directory: deadline-app
        run: |
          mvn -q spring-boot:run -Dspring-boot.run.profiles=staging > app.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "Started DeadlineApplication" app.log && exit 0
            sleep 2
          done
          cat app.log
          exit 1

      # Chrome is preinstalled on GitHub's Ubuntu runners; Selenium fetches the matching driver.
      - name: Run tests
        working-directory: deadline-tests
        run: mvn -B test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: deadline-tests/target/surefire-reports/
