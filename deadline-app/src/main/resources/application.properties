server.port=8081

# Allow the 50 MB "slow upload" test file
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Clock control (/test-support/clock) is OFF by default.
# It is switched on only by the "staging" profile (application-staging.properties).
testsupport.enabled=false

# Demo bearer tokens (a real app would use proper login)
demo.student-token=student-demo-token
demo.instructor-token=instructor-demo-token
