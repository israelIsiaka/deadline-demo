server.port=8081

# Allow the 50 MB "slow upload" test file
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Staging-only clock control (/test-support/clock). Must be false in production.
testsupport.enabled=true

# Demo bearer tokens (a real app would use proper login)
demo.student-token=student-demo-token
demo.instructor-token=instructor-demo-token
